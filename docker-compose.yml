name: bg-transparency
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bg_owner}
      POSTGRES_DB: ${POSTGRES_DB:-bg_transparency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      READER_PASSWORD: ${READER_PASSWORD:?Set READER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infrastructure/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]
    restart: unless-stopped
  migrate:
    build: {context: ., dockerfile: infrastructure/backend.Dockerfile}
    command: [alembic, upgrade, head]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bg_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bg_transparency}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [database]
  backend:
    build: {context: ., dockerfile: infrastructure/backend.Dockerfile}
    command: [uvicorn, backend.main:app, --host, 0.0.0.0, --port, "8000", --no-proxy-headers]
    environment:
      DATABASE_URL: postgresql+psycopg://bg_reader:${READER_PASSWORD}@postgres:5432/${POSTGRES_DB:-bg_transparency}
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [database, web]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: {context: ., dockerfile: infrastructure/backend.Dockerfile}
    command: [python, -m, pipeline.run_pipeline, --live, --schedule]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bg_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bg_transparency}
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [database, egress]
    volumes: [workerdata:/app/data/quarantine]
    restart: on-failure
    profiles: [ingestion]
  frontend:
    build: {context: ./frontend, args: {API_INTERNAL_URL: "http://backend:8000"}}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    networks: [web]
    restart: unless-stopped
volumes:
  pgdata:
  workerdata:
networks:
  database: {internal: true}
  web:
  egress:
